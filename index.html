<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Converse com o Assistente GPT 🤖</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        padding: 20px;
        max-width: 800px;
        margin: auto;
      }
      #chat {
        background: #fff;
        padding: 15px;
        border: 1px solid #ccc;
        height: 400px;
        overflow-y: auto;
        margin-bottom: 15px;
      }
      input[type='text'] {
        width: 75%;
        padding: 10px;
        font-size: 16px;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
      }
      .message {
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <h2>Converse com o Assistente GPT 🤖</h2>
    <div id="chat"></div>
    <input type="text" id="perguntaInput" placeholder="Digite sua pergunta..." />
    <button onclick="enviarPergunta()">Enviar</button>

    <script>
      async function enviarPergunta() {
        const input = document.getElementById('perguntaInput');
        const pergunta = input.value;
        if (!pergunta) return;

        const chat = document.getElementById('chat');
        chat.innerHTML += `<div class="message"><strong>Você:</strong> ${pergunta}</div>`;
        input.value = '';

        try {
          const resposta = await fetch('/api/ask', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ pergunta }),
          });

          const dados = await resposta.json();
          chat.innerHTML += `<div class="message"><strong>Prof. Cyborg:</strong> ${dados.resposta}</div>`;
        } catch (erro) {
          chat.innerHTML += `<div class="message"><strong>Erro:</strong> ${erro.message}</div>`;
        }

        chat.scrollTop = chat.scrollHeight;
      }
    </script>
  </body>
</html>
